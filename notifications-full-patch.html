     🩹 Notifications FULL Patch — works12
     يحل ٤ مشاكل دفعةً واحدة:

       1. ❌ الكود الحالي لا يستدعي /api/send-notification أبداً عند إرسال رسالة
          → النتيجة: لا يصل إشعار لأي أحد مهما ضبطت Firebase
          ✅ هذا الـ patch يربط كل دالة إرسال رسالة بسيرفر الإشعارات

       2. ❌ restoreSession لا يعيد تسجيل توكن FCM عند تحديث الصفحة
          ✅ ترقيع تلقائي

       3. ❌ لا يوجد زر مرئي لتفعيل الإذن لو رُفض المرة الأولى
          ✅ زر عائم 🔔 يظهر دائماً حتى يُمنح الإذن

       4. ❌ لا توجد طريقة لمعرفة هل الإشعارات تعمل أم لا
          ✅ لوحة حالة بصرية لكل خطوة

     طريقة التركيب: ضع هذا الكود **بالكامل قبل </body>** في index.html
                    ادفع لـ GitHub، انتظر النشر، ثم Hard Reload للموقع.

     ⚠️ بعد التركيب يجب Unregister للـ Service Worker القديم مرة واحدة:
        F12 → Application → Service Workers → Unregister → Ctrl+Shift+R
     ════════════════════════════════════════════════════════════════ -->

<style>
  #fcm-bell-btn{
    position:fixed; bottom:80px; left:16px; z-index:99999;
    background:linear-gradient(135deg,#dc2626,#b91c1c); color:#fff;
    border:0; border-radius:50%; width:60px; height:60px; font-size:28px;
    box-shadow:0 8px 24px rgba(220,38,38,0.5), 0 0 0 4px rgba(220,38,38,0.2);
    cursor:pointer; display:none; align-items:center; justify-content:center;
    animation:fcm-pulse 2s ease-in-out infinite;
  }
  #fcm-bell-btn.ok{
    background:linear-gradient(135deg,#16a34a,#15803d);
    box-shadow:0 8px 24px rgba(22,163,74,0.4); animation:none;
  }
  @keyframes fcm-pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.1)}
  }
  #fcm-bell-btn:hover{transform:scale(1.15)}
  #fcm-status-panel{
    position:fixed; bottom:150px; left:16px; z-index:99998;
    background:#0b1220; color:#e6eaf2; border:2px solid #233055;
    border-radius:12px; padding:14px; max-width:340px; display:none;
    font-family:Tajawal,system-ui,Arial; font-size:13px; line-height:1.6;
    box-shadow:0 12px 32px rgba(0,0,0,0.5);
  }
  #fcm-status-panel h3{color:#facc15;margin:0 0 8px;font-size:14px}
  #fcm-status-panel .step{padding:4px 0;border-bottom:1px dashed #2a3552;font-size:12px}
  #fcm-status-panel .step:last-child{border:0}
  #fcm-status-panel .ok{color:#22c55e}
  #fcm-status-panel .bad{color:#ef4444}
  #fcm-status-panel .warn{color:#f59e0b}
  #fcm-status-panel button{
    background:#2563eb;color:#fff;border:0;padding:6px 12px;border-radius:6px;
    cursor:pointer;margin-top:8px;font-size:12px
  }
</style>

<button id="fcm-bell-btn" onclick="fcmBellClick()" title="تفعيل الإشعارات">🔔</button>
<div id="fcm-status-panel"></div>

<script>
(function(){
  'use strict';

  /* ════════════════════════════════════════════════════════════
     ⭐ الجزء الأهم: ربط نظام الرسائل بسيرفر الإشعارات
     ════════════════════════════════════════════════════════════ */

  // عنوان Netlify Function (يكتشف الدومين تلقائياً)
  const NOTIFY_URL = location.origin + '/.netlify/functions/send-notification';

  // إرسال إشعار FCM (يستدعي السيرفر)
  async function triggerPush(opts){
    try{
      const body = {
        target: opts.target || 'role',          // 'role' | 'email' | 'all'
        value:  opts.value  || 'admin',
        title:  opts.title  || 'رسالة جديدة',
        body:   (opts.body || '').slice(0, 200),
        data:   opts.data   || {}
      };
      console.log('[push] →', body);
      const res = await fetch(NOTIFY_URL, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(body)
      });
      const txt = await res.text();
      console.log('[push] ← [' + res.status + ']', txt);
      return res.ok;
    }catch(e){
      console.warn('[push] error:', e);
      return false;
    }
  }
  // نُتيحه للاختبار من Console: triggerPush({target:'role',value:'admin',title:'tst',body:'x'})
  window.triggerPush = triggerPush;

  /* ════════════════════════════════════════════════════════════
     🎯 ترقيع saveMessageToSupabase (تلتقط كل الرسائل بدون استثناء)
     ════════════════════════════════════════════════════════════ */
  function patchSaveMessage(){
    if (typeof saveMessageToSupabase !== 'function') return false;
    if (saveMessageToSupabase._notifPatched) return true;
    const orig = saveMessageToSupabase;
    window.saveMessageToSupabase = function(msg){
      // 1) ننفذ الأصلي أولاً (حفظ في Supabase)
      const result = orig.apply(this, arguments);

      // 2) ثم نطلق إشعار FCM وفق نوع الرسالة
      try {
        const from = msg.from;           // 'vendor' | 'customer' | 'admin'
        const text = (msg.text || '').slice(0, 200);

        if (from === 'admin' && msg.toEmail) {
          // ← آدمن أرسل رسالة لعميل/شريك → نُبلّغه عبر بريده
          triggerPush({
            target: 'email',
            value:  msg.toEmail,
            title:  '📩 رسالة من الإدارة',
            body:   text || '(صورة مرفقة)',
            data:   { url: '/', sender: 'admin', msgId: String(msg.id) }
          });
        } else if (from === 'vendor' || from === 'customer') {
          // ← شريك/عميل أرسل رسالة دعم → نُبلّغ كل الآدمنز
          const senderTag = from === 'vendor' ? 'شريك' : 'عميل';
          triggerPush({
            target: 'role',
            value:  'admin',
            title:  '🔔 رسالة جديدة من ' + senderTag,
            body:   (msg.fromName || senderTag) + ': ' + (text || '(صورة)'),
            data:   {
              url: '/', sender: from, fromEmail: msg.fromEmail || '',
              forceAdmin: 'true', priority: 'high'
            }
          });
        }
      } catch(e){ console.warn('[notif-hook] saveMessage:', e); }

      return result;
    };
    window.saveMessageToSupabase._notifPatched = true;
    console.log('[notif-hook] saveMessageToSupabase ✅');
    return true;
  }

  /* ════════════════════════════════════════════════════════════
     🎯 ترقيع updateMessageReplyInSupabase (رد الآدمن على العميل/الشريك)
     ════════════════════════════════════════════════════════════ */
  function patchReply(){
    if (typeof updateMessageReplyInSupabase !== 'function') return false;
    if (updateMessageReplyInSupabase._notifPatched) return true;
    const orig = updateMessageReplyInSupabase;
    window.updateMessageReplyInSupabase = function(msgId, reply){
      const result = orig.apply(this, arguments);

      try {
        // نبحث عن الرسالة الأصلية لمعرفة المرسل
        const allMsgs = (typeof getMessages === 'function') ? getMessages() : [];
        const original = allMsgs.find(m => String(m.id) === String(msgId));
        if (original && original.fromEmail) {
          triggerPush({
            target: 'email',
            value:  original.fromEmail,
            title:  '✉️ رد جديد من الإدارة',
            body:   (reply || '').slice(0, 200),
            data:   { url: '/', sender: 'admin', msgId: String(msgId) }
          });
        }
      } catch(e){ console.warn('[notif-hook] reply:', e); }

      return result;
    };
    window.updateMessageReplyInSupabase._notifPatched = true;
    console.log('[notif-hook] updateMessageReplyInSupabase ✅');
    return true;
  }

  /* ════════════════════════════════════════════════════════════
     🩹 ترقيع restoreSession (إعادة تسجيل التوكن عند تحديث الصفحة)
     ════════════════════════════════════════════════════════════ */
  function patchRestore(){
    if (typeof restoreSession !== 'function') return false;
    if (restoreSession._notifPatched) return true;
    const orig = restoreSession;
    window.restoreSession = function(){
      const r = orig.apply(this, arguments);
      if (r && window.currentUser) {
        setTimeout(function(){
          if (typeof registerFCMToken === 'function') {
            console.log('[notif-hook] إعادة تسجيل التوكن بعد استعادة الجلسة');
            registerFCMToken().then(updateBellUI).catch(function(e){
              console.warn('[notif-hook] registerFCMToken:', e);
              updateBellUI();
            });
          }
        }, 500);
      }
      return r;
    };
    window.restoreSession._notifPatched = true;
    console.log('[notif-hook] restoreSession ✅');
    return true;
  }

  /* ════════════════════════════════════════════════════════════
     🔔 زر تفعيل الإشعارات (UI)
     ════════════════════════════════════════════════════════════ */
  function $(id){ return document.getElementById(id); }

  function updateBellUI(){
    const btn = $('fcm-bell-btn');
    if (!btn) return;
    const perm = ('Notification' in window) ? Notification.permission : 'unsupported';

    if (perm === 'granted' && window._fcmToken) {
      btn.classList.add('ok'); btn.innerHTML = '✅'; btn.title = 'الإشعارات مفعّلة';
      setTimeout(()=> btn.style.display = 'none', 3000);
    } else if (perm === 'denied') {
      btn.classList.remove('ok'); btn.innerHTML = '🚫';
      btn.title = 'الإشعارات محظورة — اضغط للتعليمات'; btn.style.display = 'flex';
    } else {
      btn.classList.remove('ok'); btn.innerHTML = '🔔';
      btn.title = 'تفعيل الإشعارات'; btn.style.display = 'flex';
    }
  }

  function showPanel(html){
    const p = $('fcm-status-panel');
    p.innerHTML = html + '<button onclick="document.getElementById(\'fcm-status-panel\').style.display=\'none\'">إغلاق</button>';
    p.style.display = 'block';
  }

  window.fcmBellClick = async function(){
    if (!('Notification' in window)) {
      showPanel('<h3>❌ غير مدعوم</h3><div>المتصفح لا يدعم الإشعارات.</div>'); return;
    }
    if (Notification.permission === 'denied') {
      showPanel(
        '<h3>🚫 الإشعارات محظورة</h3>' +
        '<div class="step bad">تم رفض الإذن سابقاً لهذا الموقع.</div>' +
        '<div class="step">لإعادة تفعيلها:</div>' +
        '<div class="step">1. اضغط 🔒 بجوار رابط الموقع في شريط العنوان</div>' +
        '<div class="step">2. ابحث عن "الإشعارات" واختر <b>السماح</b></div>' +
        '<div class="step">3. أعد تحميل الصفحة (Ctrl+Shift+R)</div>' +
        '<div class="step warn">إن لم يظهر بند "الإشعارات" فهو إجابة على أنه لم يُطلب — اضغط هذا الزر مرة أخرى بعد إعادة التحميل</div>'
      );
      return;
    }

    showPanel('<h3>⏳ جارٍ التفعيل...</h3>');

    try {
      if (typeof initFCM === 'function') initFCM();
      const initOK = !!window._fcmMessaging;
      if (!initOK) {
        showPanel(
          '<h3>❌ Firebase غير مهيأ</h3>' +
          '<div class="step bad">تحقق أن FCM_CONFIG في index.html يحتوي القيم الحقيقية (وليس YOUR_...)</div>' +
          '<div class="step bad">تحقق من رؤية رسائل Firebase في Console</div>'
        );
        return;
      }

      const perm = await Notification.requestPermission();
      if (perm !== 'granted') {
        showPanel('<h3>⚠️ لم يُمنح الإذن</h3><div class="step warn">حالة الإذن: ' + perm + '</div>');
        updateBellUI(); return;
      }

      if (!window.currentUser) {
        showPanel(
          '<h3>⚠️ سجّل دخولك أولاً</h3>' +
          '<div class="step ok">الإذن ممنوح ✅</div>' +
          '<div class="step bad">يجب تسجيل الدخول قبل حفظ التوكن في قاعدة البيانات</div>'
        );
        return;
      }

      if (typeof registerFCMToken === 'function') await registerFCMToken();

      if (window._fcmToken) {
        showPanel(
          '<h3>✅ تم التفعيل بنجاح</h3>' +
          '<div class="step ok">Firebase ✅</div>' +
          '<div class="step ok">الإذن: ممنوح ✅</div>' +
          '<div class="step ok">التوكن: ' + window._fcmToken.slice(0,20) + '... ✅</div>' +
          '<div class="step ok">مُسجَّل في Supabase ✅</div>' +
          '<div class="step">يمكنك استقبال الإشعارات الآن</div>'
        );
      } else {
        showPanel(
          '<h3>⚠️ التوكن لم يُولَّد</h3>' +
          '<div class="step bad">تحقق من FCM_VAPID_KEY في index.html (ليس YOUR_VAPID_PUBLIC_KEY)</div>' +
          '<div class="step bad">تحقق أن /firebase-messaging-sw.js يفتح بدون 404</div>'
        );
      }
      updateBellUI();
    } catch(e) {
      showPanel('<h3>❌ خطأ</h3><div class="step bad">' + (e.message || e) + '</div>');
      console.error('[fcm-bell]', e);
    }
  };

  /* ════════════════════════════════════════════════════════════
     ▶️ بدء التشغيل — ينتظر تحميل الكود الأصلي ثم يُرقّع
     ════════════════════════════════════════════════════════════ */
  function start(){
    const allReady =
      patchSaveMessage() &&
      patchReply() &&
      patchRestore();

    if (!allReady) {
      // إذا الدوال غير جاهزة بعد، نعيد المحاولة
      setTimeout(start, 300);
      return;
    }

    updateBellUI();
    setTimeout(()=> {
      if (Notification.permission !== 'granted' || !window._fcmToken) {
        const btn = $('fcm-bell-btn');
        if (btn) btn.style.display = 'flex';
      }
    }, 1500);

    setInterval(updateBellUI, 5000);
    console.log('[notif-hook] تم تحميل patch الإشعارات الكامل ✅');
  }

  if (document.readyState === 'complete') start();
  else window.addEventListener('load', start);
})();
</script>
