<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار سريع لنظام الإشعارات</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,Tahoma,Arial;background:#0b1220;color:#e6eaf2;margin:0;padding:16px;line-height:1.7}
  h1{color:#7dd3fc;font-size:20px;margin:6px 0 16px;text-align:center}
  .big-btn{
    display:block;width:100%;background:linear-gradient(135deg,#dc2626,#b91c1c);
    color:#fff;border:0;padding:18px;border-radius:12px;font-size:18px;font-weight:700;
    cursor:pointer;margin:12px 0;box-shadow:0 6px 20px rgba(220,38,38,0.4)
  }
  .big-btn:hover{transform:scale(1.02)}
  .big-btn.green{background:linear-gradient(135deg,#16a34a,#15803d)}
  .big-btn.blue{background:linear-gradient(135deg,#2563eb,#1e40af)}
  .test{background:#141c2f;border:1px solid #233055;border-radius:10px;padding:12px;margin:10px 0}
  .test.pass{border-color:#16a34a;background:#0f1f15}
  .test.fail{border-color:#dc2626;background:#1f0e0e}
  .test.warn{border-color:#f59e0b;background:#1f1a0e}
  .test h3{font-size:14px;margin:0 0 6px}
  .test .desc{font-size:12px;color:#94a3b8;margin:4px 0}
  .test .res{font-family:monospace;font-size:11px;direction:ltr;text-align:left;background:#0b1220;padding:6px;border-radius:5px;margin-top:6px;word-break:break-all}
  .icon{font-size:22px;margin-left:6px}
  input{width:100%;background:#0b1220;color:#fff;border:1px solid #2a3552;border-radius:8px;padding:10px;margin:6px 0;font-family:inherit;direction:ltr;text-align:left}
  .copy{background:#475569;color:#fff;border:0;padding:4px 10px;border-radius:5px;font-size:11px;cursor:pointer;margin-top:4px}
</style>
</head>
<body>

<h1>🩺 اختبار شامل لنظام الإشعارات</h1>

<input id="self-email" placeholder="ضع بريد الآدمن المسجل في fcm_tokens (لإرسال إشعار اختباري إليه)" value="">

<button class="big-btn" onclick="runAll()">🚀 افحص كل شيء الآن</button>

<div id="results"></div>

<button class="big-btn blue" onclick="sendTestNotif()" id="btn-test" style="display:none">
  📤 أرسل إشعار اختباري للبريد أعلاه
</button>

<button class="big-btn green" onclick="enableNotifs()" id="btn-enable" style="display:none">
  🔔 فعّل الإشعارات على هذا الجهاز
</button>

<script>
const ORIGIN = location.origin;
const R = document.getElementById('results');

function box(title, status, desc, result){
  const cls = status === 'pass' ? 'pass' : status === 'fail' ? 'fail' : 'warn';
  const icon = status === 'pass' ? '✅' : status === 'fail' ? '❌' : '⚠️';
  R.insertAdjacentHTML('beforeend',
    '<div class="test '+cls+'">'+
      '<h3>'+icon+' '+title+'</h3>'+
      '<div class="desc">'+desc+'</div>'+
      (result ? '<div class="res">'+result+'</div>' : '')+
    '</div>'
  );
}

async function check(url, expectedStatuses){
  try{
    const r = await fetch(url, { method: 'GET', cache: 'no-store' });
    return { ok: expectedStatuses.includes(r.status), status: r.status, url };
  }catch(e){
    return { ok: false, status: 0, error: e.message, url };
  }
}

async function runAll(){
  R.innerHTML = '<div class="test warn">⏳ جارٍ الفحص...</div>';
  await new Promise(r => setTimeout(r, 100));
  R.innerHTML = '';

  // ─── 1) Service Worker file ───
  const sw = await check(ORIGIN + '/firebase-messaging-sw.js', [200]);
  box(
    'ملف Service Worker',
    sw.ok ? 'pass' : 'fail',
    'GET /firebase-messaging-sw.js — يجب أن يرد 200',
    sw.ok ? 'OK (200)' : 'فشل: ' + (sw.status || sw.error) + '<br>هذا يعني الملف غير مرفوع في الجذر — لن تعمل أي إشعارات!'
  );

  // ─── 2) Manifest ───
  const mf = await check(ORIGIN + '/manifest.json', [200]);
  box(
    'ملف manifest.json',
    mf.ok ? 'pass' : 'warn',
    'GET /manifest.json — للـ PWA (مهم لكن ليس قاتلاً)',
    mf.ok ? 'OK (200)' : 'فشل: ' + (mf.status || mf.error)
  );

  // ─── 3) Icons ───
  const ic = await check(ORIGIN + '/icon-192.png', [200]);
  box(
    'أيقونة الإشعار',
    ic.ok ? 'pass' : 'warn',
    'GET /icon-192.png — تظهر داخل الإشعار',
    ic.ok ? 'OK' : 'مفقودة — الإشعار سيظهر بأيقونة افتراضية فقط'
  );

  // ─── 4) Netlify Function (CRITICAL) ───
  let fnRes;
  try{
    const r = await fetch(ORIGIN + '/.netlify/functions/send-notification', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: '{}'
    });
    const txt = await r.text();
    fnRes = { status: r.status, body: txt };
  }catch(e){
    fnRes = { status: 0, body: e.message };
  }

  const fnOK = fnRes.status === 200 || fnRes.status === 400 || fnRes.status === 401 || fnRes.status === 500;
  // 200 = success (empty body returns error but 200 means handler ran)
  // 400 = body missing (handler reached, validation failed) - good
  // 401 = secret missing - good (handler reached)
  // 500 = internal error - means handler ran but threw
  // 404 = function NOT deployed!
  box(
    'سيرفر الإشعارات (Netlify Function)',
    fnRes.status === 404 ? 'fail' : (fnRes.status === 500 ? 'warn' : 'pass'),
    'POST /.netlify/functions/send-notification',
    'Status: ' + fnRes.status + '<br>Body: ' + (fnRes.body || '').slice(0, 300) +
    (fnRes.status === 404 ? '<br><b style="color:#fca5a5">❌ السيرفر غير منشور أصلاً! تحقق من netlify.toml و api/send-notification.js</b>' :
     fnRes.status === 500 ? '<br><b style="color:#fde047">⚠️ السيرفر شغّال لكن وقع خطأ — قد يكون متغير بيئة مفقود</b>' :
     '<br><b style="color:#86efac">✅ السيرفر يستجيب</b>')
  );

  // ─── 5) Notification API ───
  const hasNotif = 'Notification' in window;
  const perm = hasNotif ? Notification.permission : 'unsupported';
  box(
    'إذن الإشعارات على هذا المتصفح',
    perm === 'granted' ? 'pass' : (perm === 'denied' ? 'fail' : 'warn'),
    'حالة Notification.permission',
    'القيمة: ' + perm +
    (perm === 'default' ? '<br>لم يُطلب الإذن بعد — اضغط زر "فعّل الإشعارات" أدناه' :
     perm === 'denied' ? '<br>تم رفض الإذن سابقاً — افتح إعدادات الموقع (🔒 في شريط العنوان) واسمح بالإشعارات' :
     '<br>الإذن ممنوح')
  );
  if (perm !== 'granted') document.getElementById('btn-enable').style.display = 'block';

  // ─── 6) Service Worker registration ───
  let swReg = null;
  if ('serviceWorker' in navigator) {
    try {
      const regs = await navigator.serviceWorker.getRegistrations();
      swReg = regs.find(r => r.active && r.active.scriptURL.includes('firebase-messaging-sw'));
    } catch(e){}
  }
  box(
    'تسجيل Service Worker في المتصفح',
    swReg ? 'pass' : 'warn',
    'هل المتصفح مسجَّل لاستقبال push من firebase-messaging-sw.js',
    swReg ? 'مسجَّل ومُفعَّل ✅<br>scope: ' + swReg.scope :
            'غير مسجَّل — افتح الصفحة الرئيسية للموقع، امنح الإذن، ثم ارجع هنا'
  );

  // ─── خلاصة ───
  document.getElementById('btn-test').style.display = sw.ok && fnRes.status !== 404 ? 'block' : 'none';

  box(
    '📋 الخلاصة',
    sw.ok && fnRes.status !== 404 && perm === 'granted' ? 'pass' : 'fail',
    'حالة النظام',
    (!sw.ok ? '❌ <b>ابدأ بإصلاح Service Worker 404</b><br>' : '') +
    (fnRes.status === 404 ? '❌ <b>ابدأ بإصلاح Netlify Function 404</b><br>' : '') +
    (perm !== 'granted' ? '⚠️ امنح الإذن بالضغط على الزر الأخضر<br>' : '') +
    (sw.ok && fnRes.status !== 404 && perm === 'granted' ? '✅ كل شيء يبدو جيد — جرّب إرسال إشعار اختباري' : '')
  );
}

async function enableNotifs(){
  if (!('Notification' in window)) { alert('المتصفح لا يدعم الإشعارات'); return; }
  const p = await Notification.requestPermission();
  alert('نتيجة الإذن: ' + p);
  if (p === 'granted') runAll();
}

async function sendTestNotif(){
  const email = document.getElementById('self-email').value.trim();
  if (!email) { alert('ضع بريد الآدمن المسجل أولاً'); return; }

  try{
    const r = await fetch(ORIGIN + '/.netlify/functions/send-notification', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        target: 'email',
        value:  email,
        title:  '🧪 اختبار إشعار',
        body:   'إذا وصلك هذا الإشعار بصوت فالنظام يعمل',
        data:   { url: '/', forceAdmin: 'true' }
      })
    });
    const txt = await r.text();
    box(
      'نتيجة إرسال الإشعار التجريبي',
      r.ok ? 'pass' : 'fail',
      'إلى: ' + email,
      'Status: ' + r.status + '<br>Body: ' + txt
    );
  }catch(e){
    box('فشل الإرسال', 'fail', 'خطأ في الاتصال', e.message);
  }
}
</script>

</body>
</html>
