# ════════════════════════════════════════════════════════════════
#  netlify.toml — إعدادات نشر works12.netlify.app
#  ضع هذا الملف في **جذر المستودع** بجانب index.html
# ════════════════════════════════════════════════════════════════

[build]
  # المجلد الذي ستنشره Netlify كموقع علني (الجذر يحوي index.html)
  publish   = "."

  # مجلد دوال السيرفر (Netlify Functions) — حيث api/send-notification.js
  functions = "api"

# ── أمر بناء (اختياري — لمشاريع HTML/JS بسيطة لا يلزم) ──
# command = "echo 'no build needed'"


# ════════════════════════════════════════════════════════════════
#  Redirects
#  السماح بمناداة الوظيفة عبر /api/send-notification
#  (شكل أنظف بدلاً من /.netlify/functions/send-notification)
# ════════════════════════════════════════════════════════════════
[[redirects]]
  from   = "/api/send-notification"
  to     = "/.netlify/functions/send-notification"
  status = 200


# ════════════════════════════════════════════════════════════════
#  Headers
#  ⭐ هذا الجزء يحل مشكلة 404 على firebase-messaging-sw.js
#  ويضمن صلاحيات SW عبر كامل الموقع (scope = /)
# ════════════════════════════════════════════════════════════════
[[headers]]
  for = "/firebase-messaging-sw.js"
  [headers.values]
    # نمنع التخزين القوي حتى يصل آخر تحديث للسيرفس وُركر
    Cache-Control          = "public, max-age=0, must-revalidate"
    # نسمح للـ SW بالعمل على كل الجذر، لا مجرد المسار الخاص به
    Service-Worker-Allowed = "/"
    Content-Type           = "application/javascript; charset=utf-8"

# ── ملفات PWA ──
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type  = "application/manifest+json"

# ── ترويسات CORS لـ Netlify Function ──
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Headers = "Content-Type, x-secret"
    Access-Control-Allow-Methods = "POST, OPTIONS"

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Headers = "Content-Type, x-secret"
    Access-Control-Allow-Methods = "POST, OPTIONS"


# ════════════════════════════════════════════════════════════════
#  Functions runtime
# ════════════════════════════════════════════════════════════════
[functions]
  # Node 18+ يأتي بـ fetch مدمجة (لا حاجة لـ node-fetch)
  node_bundler = "esbuild"
